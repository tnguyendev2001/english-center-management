spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/school_management_test}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true

app:
  cors:
    allowed-origins: http://localhost:5173
  time:
    zone-id: Asia/Ho_Chi_Minh
  finance:
    finance-start-date: 2026-05-01

security:
  jwt:
    issuer: school-management
    audience: school-management-web
    expiration-minutes: 240
    secret: test-only-jwt-secret-value-with-32b-min
  admin:
    username: admin
    password: Admin12345
