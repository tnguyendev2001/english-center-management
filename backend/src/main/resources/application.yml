spring:
  profiles:
    default: local
  jackson:
    time-zone: Asia/Ho_Chi_Minh
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

app:
  time:
    zone-id: Asia/Ho_Chi_Minh
  cors:
    allowed-origins: ${APP_ALLOWED_ORIGINS:${CORS_ALLOWED_ORIGINS:http://localhost:5173}}
  storage:
    base-dir: ${APP_STORAGE_BASE_DIR:uploads/academic}
    max-file-size-bytes: ${APP_STORAGE_MAX_FILE_SIZE_BYTES:20971520}

security:
  jwt:
    issuer: ${JWT_ISSUER:school-management}
    audience: ${JWT_AUDIENCE:school-management-web}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:240}
    secret: ${JWT_SECRET:}
  admin:
    username: ${APP_ADMIN_USERNAME:}
    password: ${APP_ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
